# Keeps the commit-SHA pins in .github/workflows/ current. Dependabot updates
# both the SHA and the "# vX.Y.Z" comment. Major versions are ignored here on
# purpose: these workflows run the org-wide CLA/DCO gate with the bot's key, so
# major upgrades should be deliberate, reviewed changes, not routine bumps.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
