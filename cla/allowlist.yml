
# .github/cla/allowlist.yml
#
# This file does NOT contain a per-user or per-team bypass list. It has two
# effects, both on WHICH DOCUMENT a contributor must sign, never on whether
# someone is checked at all:
#   * license_overrides.require_cla / allow_dco  — read by requires_cla.py,
#     override a licence's permissive/non-permissive classification.
#   * license_overrides.repos.<repo>.require_cla — read by
#     policy_selector.fetch_shared_config(), and `false` downgrades that whole
#     repo from CLA to DCO. This is live: vmware/.github is on DCO because of
#     the entry below.
#
# Two further top-level keys are honoured but undocumented elsewhere, so they
# are recorded here rather than left to be rediscovered: a top-level `repos:`
# block (used only when license_overrides.repos is absent or empty), and a
# top-level `repositories:` list whose entries are appended straight to the
# DCO-only set. Prefer license_overrides.repos; the other two exist for
# backwards compatibility.
#
# Who skips the gate entirely is decided in policy_selector.process_single_pr(),
# not here. Three paths return early, in order: an existing successful
# "Check CLA/DCO" status on the head SHA, a bot (BOT_ALLOWLIST or any login
# ending "[bot]"), and an org member (live is_org_member() API call).
#
# Both production workflows fetch this file from the default branch with no
# pinned ref, so any edit is live across every gated repo on the next sweep.

# -----------------------------
# LICENSE POLICY OVERRIDES
# -----------------------------
# Base truth for permissive/non-permissive comes from:
#   data/permissive_names.json + data/licenses_all.json
# The keys below *override* that base decision.
license_overrides:

  # Treat the listed SPDX (or LicenseRef) identifiers as *requiring CLA*,
  # even if the base tables list them as permissive.
  # Supports exact IDs and simple '*' wildcards (handled by requires_cla.py).
  require_cla:
    - LicenseRef-Broadcom_Source_Available
    - LicenseRef-Broadcom*
    # (add more as needed)

  # (Optional) Treat specific IDs as permissive (force allow), even if base says otherwise.
  # Only use this if you intend to *downgrade* certain licenses to permissive.
#  permissive:

  # (Optional) Per-repo overrides. Keys can be "<owner>/<repo>" or just "<repo>".
  # Useful when the detector result needs correction or you want to force policy.
  repos:
    vmware/.github:
      require_cla: false           # false = downgrade this repo to DCO-only
      # force_spdx: "MIT"         # pretend this is the detected license (rarely needed)
#    docs-site:
#      require_cla: false          # force permissive for this repo

  # (Optional) Normalize odd/legacy license IDs to canonical SPDX before evaluation.
  # The left side is what the detector finds; the right side is the canonical ID.
#  spdx_aliases:
#    "LicenseRef-BSA": "LicenseRef-Broadcom_Source_Available"
